box(5.2,.04,3.4,'#e6d9c3',5.3,.04,-4.6);
box(4.2,.9,.8,'#fbf8f2',5.4,.45,-5.9);box(4.3,.08,.88,mat('#e9e4dc',{roughness:.2}),5.4,.94,-5.9);for(let x=3.9;x<7.3;x+=1)box(.5,.03,.03,gold,x,.68,-5.48);
box(.7,.65,.5,mat('#cfc8bd',{metalness:.6,roughness:.3}),4.4,1.31,-5.95);box(.5,.1,.15,gold,4.4,1.45,-5.65);cyl(.08,.06,.13,'#fff',4.4,1.05,-5.65);
for(let i=0;i<4;i++)cyl(.08,.06,.13,['#fff','#e7c9b8','#c9d3bf','#fff'][i],5.4+i*.25,1.05,-5.8);
box(2.8,.07,.35,gold,5.9,2.15,-6.2);for(let i=0;i<7;i++)cyl(.11,.11,.3,i%2?'#d9b98a':'#f3ead9',4.8+i*.35,2.35,-6.2);
box(1,1.9,.8,'#f1ebe0',8,.95,-5.9);box(.04,.7,.04,gold,7.62,1.2,-5.48);
cyl(.65,.65,.08,mat('#fdfbf7',{roughness:.2}),6,1,-3.7);cyl(.06,.06,.95,gold,6,.5,-3.7);cyl(.4,.4,.05,gold,6,.04,-3.7);
// lounge
cyl(2.5,2.5,.03,'#e9ddc9',4.8,.045,2.9);
function sofa(x,z,ry){const g=new T.Group();g.position.set(x,0,z);g.rotation.y=ry;sc.add(g);box(2.5,.4,.9,'#fbf6ec',0,.3,0,g);box(2.5,.65,.25,'#fbf6ec',0,.75,-.38,g);for(const a of[-1.3,1.3])box(.22,.65,.9,'#f3ebdc',a,.45,0,g);box(.45,.4,.14,'#d9bd8b',-.75,.7,-.18,g);box(.45,.4,.14,'#e7c9b8',.75,.7,-.18,g)}
sofa(4.8,5,Math.PI);sofa(7.4,2.9,-Math.PI/2);
cyl(.8,.8,.07,mat('#f7f4ee',{roughness:.2}),4.8,.52,2.9);cyl(.5,.55,.45,gold,4.8,.25,2.9);cyl(.12,.08,.25,'#fff',4.8,.68,2.9);for(let i=0;i<5;i++)ball(.1,'#efc7c0',4.8+Math.cos(i*1.26)*.12,.9,2.9+Math.sin(i*1.26)*.12);
// logo wall
const cv=document.createElement('canvas');cv.width=1024;cv.height=256;const c=cv.getContext('2d');c.fillStyle='#a8853f';c.textAlign='center';c.font='600 110px Georgia';c.fillText('Reira Rich.Co',512,160);
const lg=new T.Mesh(new T.PlaneGeometry(4,1),new T.MeshBasicMaterial({map:new T.CanvasTexture(cv),transparent:true}));lg.position.set(-8.36,2,-1);lg.rotation.y=Math.PI/2;sc.add(lg);
// mirror and stove
box(.08,2.3,1.5,gold,-8.34,1.35,3.9);box(.06,2.14,1.34,mat('#d6e9ee',{metalness:.35,roughness:.12,emissive:'#6f8f99',emissiveIntensity:.3}),-8.28,1.35,3.9);
box(.9,.04,.7,'#3b3a38',6.6,1,-5.9);cyl(.2,.18,.22,gold,6.45,1.13,-5.9);cyl(.15,.12,.07,'#55524e',6.85,1.06,-5.85);
const steam=[0,1,2].map(k=>{const o=ball(.07,new T.MeshBasicMaterial({color:'#fff',transparent:true,opacity:.8}),6.45,1.35,-5.9);o.castShadow=false;o.visible=false;return o});
const CHORE={sweep:{at:[-.3,4.4],ry:0,t:14,say:'Sapu jap, biar bersih ✨'},mirror:{at:[-7.7,3.9],ry:-Math.PI/2,t:12,say:'Lap cermin bagi berkilat 🪞'},cook:{at:[6.6,-5.05],ry:Math.PI,t:15,say:'Masak mee goreng, siapa nak? 🍳'}};
// meeting / dining room
box(4.8,.03,3.4,'#e6d7bd',-4.2,.045,4.7);
box(3.3,.09,1.15,mat('#fdfbf7',{roughness:.2}),-4.2,.76,4.7);box(3.34,.025,1.19,gold,-4.2,.705,4.7);for(const x of[-5.4,-3])cyl(.08,.14,.68,gold,x,.36,4.7);
const MEET=[[-5.4,3.8,0],[-4.6,3.8,0],[-3.8,3.8,0],[-3,3.8,0],[-5,5.6,Math.PI],[-4.2,5.6,Math.PI],[-3.4,5.6,Math.PI]];
MEET.forEach(([x,z,ry])=>chair(x,z,ry));
const glass=mat('#e4f2f4',{transparent:true,opacity:.3,roughness:.1});
box(.05,1.2,2.4,glass,-1.7,.65,5.1).castShadow=false;box(.08,.05,2.4,gold,-1.7,1.27,5.1);for(const z of[3.9,6.3])box(.08,1.27,.08,gold,-1.7,.64,z);
const plates=MEET.map(([x,z,ry])=>{const g=new T.Group();g.position.set(x,.82,z<4.7?4.35:5.05);g.visible=false;sc.add(g);cyl(.19,.17,.03,'#fff',0,0,0,g);ball(.1,'#d9a04a',0,.03,0,g).scale.y=.6;ball(.04,'#6f9a4a',.07,.07,.02,g);ball(.035,'#c8503c',-.06,.08,-.02,g);return g});
const centre=new T.Group();sc.add(centre);centre.visible=false;cyl(.28,.22,.14,gold,-4.2,.88,4.7,centre);ball(.22,'#d9a04a',-4.2,.93,4.7,centre).scale.y=.55;
// staff (big-head chibi)
// Senarai staff. Folder = tempat status.md dibaca (sama cara dengan index.html).
// Aina, Siti, Nurul, Ahmad, Lina: folder sama seperti index.html. Yuna: yuna-pa (disahkan).
const STAFF=[
 {key:'yuna',v:0,name:'Yuna',role:'PA',folder:'yuna-pa',col:'#c9a65a',hij:1},
 {key:'lina',v:2,name:'Lina',role:'Social Media',folder:'lina-social',col:'#c98bb0',hij:1},
 {key:'aina',v:3,name:'Aina',role:'Support',folder:'aina-support',col:'#ea8f86',hij:1},
 {key:'siti',v:4,name:'Siti',role:'Sales & Marketing',folder:'siti-sales',col:'#e7b062',hij:1},
 {key:'nurul',v:5,name:'Nurul',role:'Finance',folder:'nurul-finance',col:'#7fb5a8',hij:1},
 {key:'ahmad',v:6,name:'Ahmad',role:'Tech',folder:'ahmad-tech',col:'#7d9bd1',hij:0}];
const SEAT=[[3.9,4.8,Math.PI],[4.8,4.8,Math.PI],[5.7,4.8,Math.PI],[7.2,2.1,-Math.PI/2],[7.2,3.0,-Math.PI/2],[7.2,3.9,-Math.PI/2],[3,2.9,Math.PI/2]];
function face(i){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
 const iris=['#8a5a2b','#7a3f4d','#5b4a86','#8a4636','#6e5a24','#2f6a5c','#35517f'][i];
 const oval=(x,y,a,b,col)=>{g.fillStyle=col;g.beginPath();g.ellipse(x,y,a,b,0,0,7);g.fill()};
 for(const x of[74,182]){oval(x,112,31,40,'#3a2418');oval(x,115,25,33,iris);oval(x,108,13,18,'#24150f');oval(x-9,97,9,11,'#fff');oval(x+10,130,5,5,'#fff');
  g.strokeStyle='#3a2418';g.lineWidth=8;g.lineCap='round';g.beginPath();g.arc(x,112,37,Math.PI*1.17,Math.PI*1.83);g.stroke()}
 oval(42,165,22,12,'#f2929288');oval(214,165,22,12,'#f2929288');
 g.strokeStyle='#a84f48';g.lineWidth=7;g.beginPath();g.arc(128,162,17,.2*Math.PI,.8*Math.PI);g.stroke();
 const t=new T.CanvasTexture(c);t.anisotropy=8;return t}
const el=(cls,t)=>{const d=document.createElement('div');d.className=cls;d.textContent=t;document.body.append(d);return d};
const people=STAFF.map(({key,v,name,role,col,hij},i)=>{const g=new T.Group();sc.add(g);g.scale.setScalar(.88);const body=new T.Group();g.add(body);
 const legs=[-.12,.12].map(x=>{const l=new T.Group();l.position.set(x,.38,0);body.add(l);box(.16,.36,.18,'#8b7a66',0,-.18,0,l);return l});
 cyl(.17,hij?.34:.24,.46,col,0,.6,0,body);cyl(.19,.2,.06,'#fffdf8',0,.82,0,body);ball(.045,gold,0,.74,.22,body);
 const arms=[-.27,.27].map(x=>{const a=new T.Group();a.position.set(x,.78,0);body.add(a);box(.11,.36,.13,col,0,-.15,0,a);ball(.075,'#fbd9c0',0,-.36,0,a);return a});
 const HY=1.3;ball(.46,'#fbd9c0',0,HY,0,body);
 mesh(new T.SphereGeometry(.468,48,32,Math.PI*.22,Math.PI*.56,Math.PI*.34,Math.PI*.42),new T.MeshBasicMaterial({map:face(v),transparent:true,toneMapped:false}),0,HY,0,body).castShadow=false;
 const veil=mat(hij?['#b99455','#e6a3ac','#b8a0d0','#e99a86','#e8b86a','#8cc0ae'][v]:'#4a3326').clone();veil.side=T.DoubleSide;
 mesh(new T.SphereGeometry(.5,40,24,0,Math.PI*2,0,Math.PI*.31),veil,0,HY+.01,0,body);
 mesh(new T.SphereGeometry(.5,40,24,Math.PI*.82,Math.PI*1.36,Math.PI*.28,Math.PI*(hij?.52:.3)),veil,0,HY+.01,0,body);
 if(hij){cyl(.26,.36,.24,veil,0,.9,-.02,body);const fx=i%2?-.3:.3;for(let k=0;k<5;k++)ball(.045,'#fffdf8',fx+Math.cos(k*1.256)*.055,HY+.34+Math.sin(k*1.256)*.055,.31,body);ball(.035,gold,fx,HY+.34,.345,body)}
 else for(let k=-2;k<3;k++)ball(.13,veil,k*.11,HY+.37-Math.abs(k)*.025,.24,body);
 const cup=cyl(.07,.055,.13,'#fff',0,-.42,.08,arms[1]);cup.visible=false;
 const tool=()=>{const t=new T.Group();t.visible=false;t.position.y=-.36;arms[1].add(t);return t};
 const broom=tool();cyl(.022,.022,.9,'#b58a55',0,-.1,.12,broom);cyl(.06,.17,.22,'#e0bd6c',0,-.6,.12,broom);
 const cloth=tool();box(.2,.17,.05,'#8fc7d6',0,-.04,.06,cloth);
 const spoon=tool();cyl(.02,.02,.34,'#b58a55',0,-.12,.06,spoon);ball(.05,'#b58a55',0,-.3,.06,spoon);
 const p={key,want:'load',line:'',tools:{sweep:broom,mirror:cloth,cook:spoon},name,i,g,body,legs,arms,cup,path:[],mode:'desk',wait:4+i*3,bub:null,bt:0,tag:el('tag',name+' · '+role)};
 g.position.set(DESK[i][0],0,DESK[i][1]-.75);return p});
// walking routes go through the two aisles so nobody crosses furniture
const PAN=[[3.9,-4.9],[4.6,-4.9],[5.3,-4.9]];
function go(p,mode){const from=p.g.position,to=mode=='desk'?[DESK[p.i][0],DESK[p.i][1]-.75]:mode=='pantry'?PAN[p.i%3]:CHORE[mode]?CHORE[mode].at:mode=='meet'||mode=='eat'?MEET[p.i]:SEAT[p.i];
 const row=z=>z<-2.5?-2.5:z<0?.55:3.05;
 const lane=(x,z)=>x>1.6?[[1.4,z]]:z>3.2&&x>-5.9&&x<-2.4?(z<4.7?[[x,3.05],[1.4,3.05]]:[[x,z],[-6.7,z],[-6.7,3.05],[1.4,3.05]]):z>2.8?[[x,3.05],[1.4,3.05]]:[[x+1.3,z],[x+1.3,row(z)],[1.4,row(z)]];
 const a=lane(from.x,from.z),b=lane(to[0],to[1]).reverse();
 Object.values(p.tools).forEach(t=>t.visible=false);p.path=[...a,...b,[to[0],to[1]]];p.mode=mode;p.moving=true;if(mode=='desk')p.cup.visible=false;say(p,'')}
function say(p,t,s=3.2){if(p.bub){p.bub.remove();p.bub=null}if(t){p.bub=el('bub',t);p.bt=s}}
const free=()=>Object.keys(CHORE).filter(k=>!people.some(q=>q.mode==k));
const idleNext=()=>{const f=free();return f.length&&Math.random()<.6?f[Math.random()*f.length|0]:'pantry'};
function tick(dt,time){
 for(const p of people){const g=p.g;let sit=false;
  if(p.moving){const[x,z]=p.path[0],dx=x-g.position.x,dz=z-g.position.z,d=Math.hypot(dx,dz),s=1.7*dt;
   if(d<=s){g.position.x=x;g.position.z=z;p.path.shift();if(!p.path.length){p.moving=false;
      if(CHORE[p.mode]){const k=CHORE[p.mode];g.rotation.y=k.ry;p.wait=k.t;p.tools[p.mode].visible=true;say(p,k.say)}
      else if(p.mode=='pantry'){g.rotation.y=Math.PI;p.wait=4;say(p,'Buat kopi dulu ☕')}
      else if(p.mode=='meet'||p.mode=='eat'){g.rotation.y=MEET[p.i][2];p.wait=p.mode=='eat'?24:28}
      else if(p.mode=='lounge'){g.rotation.y=SEAT[p.i][2];p.wait=18+Math.random()*10}
      else{g.rotation.y=0;p.wait=14+Math.random()*14}}}
   else{g.position.x+=dx/d*s;g.position.z+=dz/d*s;g.rotation.y=Math.atan2(dx,dz)}
  }else{sit=['desk','lounge','meet','eat'].includes(p.mode);p.wait-=dt;
   if(p.mode=='pantry'&&p.wait<1.5)p.cup.visible=true;
   if(p.wait<0){
    if(p.mode=='cook'){say(p,'');people.forEach(q=>{if(q.want=='free'&&q.mode!='eat')go(q,'eat')});say(p,'Dah siap! Jom makan 🍽️',4)}
    else if(p.want=='free')go(p,p.mode=='pantry'?'lounge':idleNext());
    else if(p.mode!='desk')go(p,'desk');
    else p.wait=5}}
  // bubble kekal di meja: tugas sebenar dari status.md
  if(!p.moving&&p.mode=='desk'&&p.want!='free'&&p.line&&(!p.bub||p.bub.textContent!=p.line))say(p,p.line,1e9);
  const sw=p.moving?Math.sin(time*9)*.6:0;
  p.legs[0].rotation.x=sit?-1.45:sw;p.legs[1].rotation.x=sit?-1.45:-sw;
  p.arms[0].rotation.x=sit&&p.mode=='desk'?-.9+Math.sin(time*11+p.i)*.12:-sw;
  p.arms[1].rotation.x=p.cup.visible?-.9:sit&&p.mode=='desk'?-.9+Math.cos(time*11+p.i)*.12:sw;
  if(!p.moving&&p.mode=='sweep'){p.arms[1].rotation.set(-.75,0,Math.sin(time*4)*.5);g.rotation.y=Math.sin(time*.7)*.7}
  else if(!p.moving&&p.mode=='mirror')p.arms[1].rotation.set(-2.1+Math.sin(time*5)*.25,0,Math.cos(time*5)*.35);
  else if(!p.moving&&p.mode=='cook')p.arms[1].rotation.set(-1.25+Math.sin(time*6)*.15,0,Math.cos(time*6)*.2);
  else p.arms[1].rotation.z=0;
  if(!p.moving&&p.mode=='eat')p.arms[1].rotation.set(-1.1-Math.max(0,Math.sin(time*3+p.i*1.7))*.8,0,0);
  p.body.position.y=sit?.12:p.moving?Math.abs(Math.sin(time*9))*.05:0;
  if(p.bub&&(p.bt-=dt)<0)say(p,'');
 }
 const cooking=people.some(q=>q.mode=='cook'&&!q.moving);steam.forEach((o,k)=>{const u=(time*.6+k/3)%1;o.visible=cooking;o.position.y=1.3+u*.8;o.material.opacity=.8*(1-u)});
 people.forEach(p=>plates[p.i].visible=p.mode=='eat'&&!p.moving);centre.visible=plates.some(o=>o.visible);
}

// ---- status: cara baca sama dengan index.html (GitHub contents API, token dari ⚙ Tetapan index.html) ----
const KEY='aiOfficeSettings';
let cfg=null,activeBranch='main';const shaDate={};
try{cfg=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
const DEMO={yuna:['Working','Susun jadual boss'],aina:['Working','Jawab soalan akses ebook'],siti:['Waiting for OK','Kod diskaun PAYDAY15'],nurul:['Sleeping','-'],lina:['Working','Plan posting Disember'],ahmad:['Working','Betulkan link sales page']};
const repoUrl=()=>`https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/`;
async function ghApi(path){
 const r=await fetch(repoUrl()+path,{cache:'no-store',headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'}});
 if(r.status===401)throw new Error('Token salah atau tamat tempoh. Buka ⚙ Tetapan di Dashboard.');
 if(!r.ok)throw new Error('GitHub error '+r.status);return r.json()}
async function pickBranch(){
 const b=(cfg.branch||'auto').trim();if(b&&b.toLowerCase()!=='auto'){activeBranch=b;return}
 const cand=(await ghApi('branches?per_page=100')).filter(x=>x.name==='main'||x.name.startsWith('claude/'));let best=null,bt=0;
 for(const c of cand){const sha=c.commit.sha;if(!shaDate[sha]){const cm=await ghApi('commits/'+sha);shaDate[sha]=Date.parse(cm.commit.committer.date)||0}if(shaDate[sha]>bt){bt=shaDate[sha];best=c.name}}
 activeBranch=best||'main'}
async function readText(path){
 const r=await fetch(repoUrl()+'contents/'+path.split('/').map(encodeURIComponent).join('/')+'?ref='+encodeURIComponent(activeBranch),{cache:'no-store',headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github.raw+json'}});
 if(r.status===404)return null;
 if(r.status===401)throw new Error('Token salah atau tamat tempoh. Buka ⚙ Tetapan di Dashboard.');
 if(r.status===403)throw new Error('GitHub tolak akses (had permintaan atau token tiada kebenaran Contents: Read).');
 if(!r.ok)throw new Error('GitHub error '+r.status);return r.text()}
const field=(txt,key)=>{const m=(txt||'').match(new RegExp('^[-\\s]*'+key+'\\s*:\\s*(.+)$','im'));return m?m[1].trim():''};
// Tugas dipaparkan dalam bubble: buang emel, nombor telefon, no. tiket/URL, dan potong pendek. inbox.md TIDAK dibaca langsung.
const safeTask=t=>{t=(t||'').replace(/https?:\/\/\S+|\S+@\S+|#\d+|\+?\d[\d\s-]{6,}\d/g,'').replace(/\s+/g,' ').trim();return t.length>40?t.slice(0,39)+'…':t};
function applyStatus(map,missing=[]){
 for(const p of people){
  const [st,task]=map[p.key]||['Sleeping','-'],tk=safeTask(task==='-'?'':task);
  p.want=/wait/i.test(st)?'wait':/work/i.test(st)?'work':'free';
  p.line=p.want=='wait'?'✋ '+p.name+' tunggu OK'+(tk?': '+tk:''):p.want=='work'?'💻 '+p.name+(tk?': '+tk:' sedang kerja'):'';
  if(p.want!='free'&&p.mode!='desk')go(p,'desk');
  else if(p.want=='free'&&p.mode=='desk')go(p,idleNext());
 }
 return missing}
let timer=null;
async function refresh(){
 if(!cfg){applyStatus(DEMO);src.textContent='Data contoh · tetapkan token di Dashboard (⚙)';return}
 try{await pickBranch();const map={},missing=[];
  for(const s of STAFF){const t=await readText(s.folder+'/status.md');if(t===null)missing.push(s.name);map[s.key]=[field(t,'status')||'Sleeping',field(t,'task')||'-']}
  applyStatus(map);src.textContent='Dikemas kini '+new Date().toLocaleTimeString('ms-MY')+' · '+activeBranch+(missing.length?' · tiada status.md: '+missing.join(', '):'')}
 catch(e){src.textContent='⚠ '+e.message}}
ref.onclick=refresh;
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
window.applyStatus=applyStatus;
refresh();timer=setInterval(refresh,30000);
// camera: drag to turn, pinch or wheel to zoom
let az,zoom,fx;const home=()=>{az=innerWidth<innerHeight?.2:.62;zoom=1;fx=0};home();rst.onclick=home;
const pts=new Map();let pd=0;const cvs=R.domElement;
cvs.onpointerdown=e=>{cvs.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);pd=0};
cvs.onpointermove=e=>{if(!pts.has(e.pointerId))return;const o=pts.get(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);
 if(pts.size==1)az=Math.max(.05,Math.min(1.5,az-(e.clientX-o[0])*.006));else{const[a,b]=[...pts.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd)zoom=Math.max(.7,Math.min(3,zoom*d/pd));pd=d}};
cvs.onpointerup=cvs.onpointercancel=e=>pts.delete(e.pointerId);
cvs.onwheel=e=>{zoom=Math.max(.7,Math.min(3,zoom*(e.deltaY<0?1.1:.9)))};
const v=new T.Vector3();
function place(d,p,y){v.set(p.g.position.x,y,p.g.position.z).project(cam);d.style.left=(v.x+1)/2*innerWidth+'px';d.style.top=(1-v.y)/2*innerHeight+'px'}
function render(){const w=innerWidth,h=innerHeight,a=w/h;if(cvs.width!=Math.floor(w*R.getPixelRatio())||cvs.height!=Math.floor(h*R.getPixelRatio()))R.setSize(w,h);
 const half=(a<1?9.1/a:Math.max(7.6,11.2/a))/zoom;Object.assign(cam,{left:-half*a,right:half*a,top:half,bottom:-half});cam.updateProjectionMatrix();
 cam.position.set(Math.sin(az)*30,24,Math.cos(az)*30);cam.lookAt(0,.6,0);cam.updateMatrixWorld();R.render(sc,cam);
 for(const p of people){place(p.tag,p,1.95);p.tag.style.display=p.bub||(!p.moving&&(p.mode=='meet'||p.mode=='eat'))?'none':'';if(innerWidth<600)p.tag.textContent=p.name;if(p.bub)place(p.bub,p,2.1)}}
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;tick(dt,n/1000);render();requestAnimationFrame(loop)}
window.sim=s=>{for(let i=0;i<s*20;i++)tick(.05,i*.05);render()};
requestAnimationFrame(loop);
</script></body></html>
